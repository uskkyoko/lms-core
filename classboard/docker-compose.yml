services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classboard
      POSTGRES_USER: classboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - classboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classboard -d classboard"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      PORT: "8080"
      APP_VERSION: "1"
      LOG_LEVEL: info
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: classboard
      DB_USER: classboard
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  classboard_pg:
