name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: classboard/requirements-dev.txt
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classboard
          POSTGRES_PASSWORD: classboard
          POSTGRES_DB: classboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classboard -d classboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: classboard/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest
        env:
          # Disposable password for the Actions service container. It is not
          # the password of any deployed database.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: classboard
          DB_USER: classboard
          DB_PASSWORD: classboard
        run: pytest --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: classboard/test-results/junit.xml

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: classboard
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/classboard:${{ github.sha }}
            ghcr.io/${{ github.repository }}/classboard:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
